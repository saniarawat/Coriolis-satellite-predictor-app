name: Refresh TLE Data

on:
  schedule:
    # Runs every 6 hours at minute 0
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  refresh-tles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch TLEs from Space-Track
        run: |
          # 1. Login to Space-Track and save the authentication cookie
          curl -c cookies.txt -d "identity=${{ secrets.SPACETRACK_USER }}&password=${{ secrets.SPACETRACK_PASSWORD }}" https://www.space-track.org/ajaxauth/login
          
          # 2. Download the active satellite catalog (3-line format) using the cookie
          curl -s -b cookies.txt "https://www.space-track.org/basicspacedata/query/class/gp/decay_date/null-val/EPOCH/%3Enow-30/orderby/NORAD_CAT_ID/format/3le/emptyresult/show" -o tles.txt

          LINE_COUNT=$(wc -l < tles.txt)
          echo "Lines fetched: $LINE_COUNT"

          # Fail early if response looks empty or is an error message
          if [ "$LINE_COUNT" -lt 3 ]; then
            echo "ERROR: TLE file too small — Authentication may have failed or API returned an error."
            cat tles.txt
            exit 1
          fi

      - name: Upload TLEs to Render app
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "https://satellite-predictor.onrender.com/api/satellites/upload" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_SECRET }}" \
            -H "Content-Type: text/plain" \
            --data-binary @tles.txt \
            --max-time 120)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "Response body: $BODY"
          echo "HTTP status:   $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Upload failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "TLE upload successful!"
