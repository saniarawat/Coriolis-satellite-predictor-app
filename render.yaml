services:
  - type: web
    name: satellite-predictor
    runtime: python
    # Build from repo root so pip can find backend/requirements.txt via -r
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
